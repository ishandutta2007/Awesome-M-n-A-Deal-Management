<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#titleGrad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #e2e8f0;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .grid-line {
      stroke: #ffffff;
      stroke-opacity: 0.04;
      stroke-width: 1;
    }
    
    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(1); opacity: 0.3; }
      50% { transform: translateY(-15px) scale(1.1); opacity: 0.7; }
      100% { transform: translateY(0px) scale(1); opacity: 0.3; }
    }

    @keyframes pulseGlow {
      0% { opacity: 0.2; }
      50% { opacity: 0.5; }
      100% { opacity: 0.2; }
    }

    .particle {
      animation: floatParticle 6s ease-in-out infinite;
    }
    .particle-delayed {
      animation: floatParticle 8s ease-in-out infinite 2s;
    }
    .glow-bg {
      animation: pulseGlow 5s ease-in-out infinite;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Background Orbs (behind everything) -->
  <circle class="glow-bg" cx="150" cy="80" r="140" fill="#6366f1" filter="blur(60px)" opacity="0.3" />
  <circle class="glow-bg" cx="1050" cy="240" r="160" fill="#a855f7" filter="blur(70px)" opacity="0.3" />

  <!-- Tech Grid Overlay Pattern -->
  <g>
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="320" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="320" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="320" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="320" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="320" class="grid-line" />
  </g>

  <!-- Dynamic Floating Decorative Particles -->
  <circle class="particle" cx="100" cy="220" r="6" fill="#38bdf8" />
  <circle class="particle-delayed" cx="1120" cy="90" r="8" fill="#818cf8" />
  <circle class="particle" cx="980" cy="270" r="5" fill="#c084fc" />
  <circle class="particle-delayed" cx="80" cy="70" r="4" fill="#34d399" />

  <!-- Glassmorphism Card Frame in Foreground -->
  <rect x="50" y="40" width="1100" height="240" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />

  <!-- Decorative Top Tag -->
  <rect x="80" y="70" width="220" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
  <text x="190" y="90" text-anchor="middle" class="badge-text">💼 M&amp;A DEAL ECOSYSTEM</text>

  <!-- Foreground Title and Subtitle -->
  <g filter="url(#glow)">
    <text x="80" y="155" class="title">Awesome M&amp;A Deal Management 🚀</text>
  </g>
  <text x="80" y="200" class="subtitle">Curated SaaS Platforms, Open-Source Virtual Data Rooms (VDR) &amp; Diligence AI 📊</text>

  <!-- Feature Pills -->
  <g transform="translate(80, 222)">
    <rect x="0" y="0" width="160" height="26" rx="6" fill="#334155" opacity="0.8" />
    <text x="80" y="17" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">🔒 Virtual Data Rooms</text>

    <rect x="175" y="0" width="170" height="26" rx="6" fill="#334155" opacity="0.8" />
    <text x="260" y="17" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">🤖 Diligence AI Agents</text>

    <rect x="360" y="0" width="170" height="26" rx="6" fill="#334155" opacity="0.8" />
    <text x="445" y="17" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">📈 Pipeline Tracking</text>
  </g>
</svg>
