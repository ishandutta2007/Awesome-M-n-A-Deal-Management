<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes floatParticle{0%{transform:translateY(0) scale(1);opacity:.3}50%{transform:translateY(-15px) scale(1.1);opacity:.7}}@keyframes pulseGlow{0%{opacity:.2}50%{opacity:.5}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:46px;fill:url(#titleGrad)}.subtitle{font-weight:500;font-size:20px;fill:#e2e8f0}.badge-text{font-weight:600;font-size:13px;fill:#38bdf8}.grid-line{stroke:#fff;stroke-opacity:.04;stroke-width:1}.particle{animation:floatParticle 6s ease-in-out infinite}.particle-delayed{animation:floatParticle 8s ease-in-out infinite 2s}.glow-bg{animation:pulseGlow 5s ease-in-out infinite}</style><rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/><circle cx="150" cy="80" r="140" fill="#6366f1" class="glow-bg" filter="blur(60px)" opacity=".3"/><circle cx="1050" cy="240" r="160" fill="#a855f7" class="glow-bg" filter="blur(70px)" opacity=".3"/><g><line x1="0" x2="1200" y1="60" y2="60" class="grid-line"/><line x1="0" x2="1200" y1="120" y2="120" class="grid-line"/><line x1="0"